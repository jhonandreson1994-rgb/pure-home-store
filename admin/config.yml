function go(panel){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.s-item').forEach(i=>i.classList.remove('active'));
  const el=document.getElementById('panel-'+panel);
  if(el) el.classList.add('active');
  document.querySelectorAll('.s-item').forEach(i=>{ if(i.getAttribute('onclick')?.includes(`'${panel}'`)) i.classList.add('active'); });
  const m=META[panel]||{title:panel,sub:'',btn:'Save',btnFn:''};
  document.getElementById('page-title').textContent=m.title;
  document.getElementById('page-sub').textContent=m.sub;
  const btn=document.getElementById('top-action-btn');
  btn.textContent=m.btn; btn.onclick=new Function(m.btnFn);
  // Panel-specific renders
  if(panel==='dashboard') renderDashboard();
  if(panel==='orders') renderOrdersTable();
  if(panel==='products') renderProductsTable();
  if(panel==='blog') renderBlogTable();
  if(panel==='add-product') resetProdForm();
  if(panel==='add-blog') resetBlogForm();
  if(panel==='email-marketing') renderEmailMarketing();
  if(panel==='seo') loadSeoForm();
  if(panel==='email-settings') loadEmailSettings();
  if(panel==='payments') loadPayments();
  if(panel==='store-settings') loadStoreSettings();
}

function switchTab(group, tab){
  const panels=document.querySelectorAll(`[id^="${group}-"]`);
  const tabs=document.querySelectorAll('.tabs .tab');
  // Hide all tab panels in this group
  panels.forEach(p=>{if(p.classList.contains('tab-panel'))p.classList.remove('active')});
  const target=document.getElementById(`${group}-${tab}`);
  if(target) target.classList.add('active');
  // Update tab active state
  tabs.forEach((t,i)=>{
    const fn=t.getAttribute('onclick')||'';
    t.classList.toggle('active', fn.includes(`'${tab}'`));
  });
}

// ═══════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════
function renderDashboard(){
  const active=products.filter(p=>p.status==='active');
  const totalRev=orders.reduce((s,o)=>s+(parseFloat(o.total)||0),0);
  const pending=orders.filter(o=>o.status==='pending').length;
  document.getElementById('d-rev').textContent='$'+totalRev.toFixed(0);
  document.getElementById('d-orders').textContent=orders.length;
  document.getElementById('d-prods').textContent=active.length;
  document.getElementById('d-rev-chg').textContent=totalRev>0?`↑ ${orders.length} orders total`:'Start marketing to earn!';
  document.getElementById('d-rev-chg').className='stat-chg '+(totalRev>0?'chg-up':'chg-neutral');
  document.getElementById('d-pending-count').textContent=pending+' pending';
  const badge=document.getElementById('orders-badge');
  badge.style.display=pending>0?'inline':'none'; badge.textContent=pending;
  // Recent orders
  const tbody=document.getElementById('d-orders-tbody');
  tbody.innerHTML=orders.length===0
    ?'<tr><td colspan="4"><div class="empty-state"><div class="empty-icon">📭</div><p>No orders yet. Start marketing to your 5,000 leads!</p></div></td></tr>'
    :orders.slice(-8).reverse().map(o=>`<tr><td><strong>#${o.id}</strong></td><td>${o.customer}</td><td><strong>$${o.total}</strong></td><td><span class="badge badge-${statusColor(o.status)}">${o.status}</span></td></tr>`).join('');
  // Setup checklist
  const checks=[
    {ok:products.length>0,text:'Products added to store',action:"go('add-product')"},
    {ok:!!paymentData.paypal?.enabled||!!paymentData.stripe?.enabled,text:'Payment gateway connected',action:"go('payments')"},
    {ok:!!smtpData.host||!!smtpData.platform,text:'Email/SMTP configured',action:"go('email-settings')"},
    {ok:!!seoData.siteTitle,text:'SEO settings configured',action:"go('seo')"},
    {ok:blogs.length>0,text:'First blog post published',action:"go('add-blog')"},
    {ok:emailCampaigns.length>0,text:'First email campaign created',action:"go('email-marketing')"},
    {ok:!!storeSettings.domain,text:'Custom domain configured',action:"go('store-settings')"},
  ];
  document.getElementById('setup-checklist').innerHTML=checks.map(c=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:.5rem;font-size:.82rem">
        <span>${c.ok?'✅':'⬜'}</span>
        <span style="color:${c.ok?'var(--text)':'var(--text2)'}">${c.text}</span>
      </div>
      ${c.ok?'':`<button class="btn btn-sm" onclick="${c.action}" style="font-size:.68rem;padding:.25rem .6rem">Fix →</button>`}
    </div>`).join('');
}

function statusColor(s){ return {delivered:'green',shipped:'blue',processing:'yellow',pending:'red',cancelled:'red'}[s]||'yellow'; }

// ═══════════════════════════════════════════
// ORDERS
// ═══════════════════════════════════════════
function renderOrdersTable(search='',statusF=''){
  let list=orders.filter(o=>{
    const ms=!search||o.customer?.toLowerCase().includes(search.toLowerCase())||String(o.id).includes(search);
    const mst=!statusF||o.status===statusF;
    return ms&&mst;
  });
  document.getElementById('orders-tbody').innerHTML=list.length===0
    ?'<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📭</div><p>No orders found. Share your store to start receiving orders!</p></div></td></tr>'
    :list.slice().reverse().map(o=>`<tr style="cursor:pointer" onclick="viewOrder('${o.id}')">
      <td><strong>#${o.id}</strong></td>
      <td><div class="t-name">${o.date||'-'}</div></td>
      <td><div class="t-name">${o.customer}</div><div class="t-sub">${o.email||''}</div></td>
      <td>${o.items||'-'}</td>
      <td><strong>$${o.total}</strong></td>
      <td><span class="badge badge-${o.payment==='paypal'?'blue':o.payment==='stripe'?'purple':'yellow'}">${o.payment||'card'}</span></td>
      <td onclick="event.stopPropagation()">
        <select onchange="setOrderStatus('${o.id}',this.value)" style="padding:.3rem .5rem;border:1px solid var(--border);border-radius:6px;font-size:.72rem;font-family:inherit;cursor:pointer">
          <option value="pending" ${o.status==='pending'?'selected':''}>🔴 Pending</option>
          <option value="processing" ${o.status==='processing'?'selected':''}>🟡 Processing</option>
          <option value="shipped" ${o.status==='shipped'?'selected':''}>🔵 Shipped</option>
          <option value="delivered" ${o.status==='delivered'?'selected':''}>🟢 Delivered</option>
          <option value="cancelled" ${o.status==='cancelled'?'selected':''}>⚫ Cancelled</option>
        </select>
      </td>
      <td><button class="btn btn-sm" onclick="event.stopPropagation();viewOrder('${o.id}')">👁️ View</button></td>
    </tr>`).join('');
}

function searchOrders(q){ renderOrdersTable(q); }
function filterOrderStatus(s){ renderOrdersTable('',s); }

function setOrderStatus(id,status){
  const o=orders.find(x=>x.id===id); if(!o) return;
  o.status=status;
  DB.set('orders',orders);
  showToast(`✅ Order #${id} marked as ${status}`,'success');
}

function viewOrder(id){
  const o=orders.find(x=>x.id===id); if(!o) return;
  document.getElementById('order-modal-body').innerHTML=`
    <div class="grid-2" style="gap:.8rem;margin-bottom:1rem">
      <div><div class="f-label">Order ID</div><strong>#${o.id}</strong></div>
      <div><div class="f-label">Date</div>${o.date||'-'}</div>
      <div><div class="f-label">Customer</div><strong>${o.customer}</strong></div>
      <div><div class="f-label">Email</div>${o.email||'-'}</div>
      <div><div class="f-label">Phone</div>${o.phone||'-'}</div>
      <div><div class="f-label">Payment</div><span class="badge badge-blue">${o.payment||'card'}</span></div>
    </div>
    <div style="background:#F9FAFB;border-radius:8px;padding:.8rem;margin-bottom:.8rem;font-size:.82rem">
      <div class="f-label">Items</div><p>${o.items||'-'}</p>
      <div class="f-label" style="margin-top:.5rem">Delivery Address</div><p>${o.address||'-'}</p>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:.9rem;font-weight:700;padding:.5rem 0;border-bottom:1px solid var(--border);margin-bottom:.8rem">
      <span>Total</span><span style="color:var(--green)">$${o.total} AUD</span>
    </div>
    <div class="f-group"><label class="f-label">Update Status</label>
      <select class="f-select" id="modal-status" onchange="setOrderStatus('${o.id}',this.value)">
        <option value="pending" ${o.status==='pending'?'selected':''}>🔴 Pending</option>
        <option value="processing" ${o.status==='processing'?'selected':''}>🟡 Processing</option>
        <option value="shipped" ${o.status==='shipped'?'selected':''}>🔵 Shipped</option>
        <option value="delivered" ${o.status==='delivered'?'selected':''}>🟢 Delivered</option>
        <option value="cancelled" ${o.status==='cancelled'?'selected':''}>⚫ Cancelled</option>
      </select>
    </div>
    <div class="f-group"><label class="f-label">Tracking Number (for shipped orders)</label>
      <input class="f-input" id="modal-tracking" placeholder="e.g. AP1234567890AU" value="${o.tracking||''}">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="saveOrderTracking('${o.id}')">💾 Save & Send Tracking Email</button>
      <button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">🗑️ Delete Order</button>
    </div>`;
  document.getElementById('order-modal').classList.add('open');
}

function saveOrderTracking(id){
  const tracking=document.getElementById('modal-tracking').value;
  const status=document.getElementById('modal-status').value;
  const o=orders.find(x=>x.id===id); if(!o) return;
  o.tracking=tracking; o.status=status;
  DB.set('orders',orders);
  closeModal();
  showToast('✅ Order updated! In production, tracking email would be sent automatically.','success');
}

function deleteOrder(id){ if(!confirm('Delete order #'+id+'?')) return; orders=orders.filter(o=>o.id!==id); DB.set('orders',orders); closeModal(); renderOrdersTable(); showToast('🗑️ Order deleted','info'); }
function closeModal(){ document.getElementById('order-modal').classList.remove('open'); }

function exportOrdersCSV(){
  if(!orders.length){showToast('❌ No orders to export','error');return;}
  const rows=['Order ID,Date,Customer,Email,Items,Total,Status,Tracking',...orders.map(o=>`${o.id},${o.date||''},${o.customer||''},${o.email||''},${(o.items||'').replace(/,/g,';')},$${o.total},${o.status||''},${o.tracking||''}`)];
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pure-home-orders.csv'; a.click();
  showToast('📥 Orders exported successfully!','success');
}


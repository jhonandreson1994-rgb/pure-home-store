function loadSeoForm(){
  document.getElementById('seo-site-title').value=seoData.siteTitle||'';
  document.getElementById('seo-site-desc').value=seoData.siteDesc||'';
  document.getElementById('seo-keywords').value=seoData.keywords||'';
  document.getElementById('seo-ga').value=seoData.ga||'';
  document.getElementById('seo-pixel').value=seoData.pixel||'';
  // Page-specific
  ['home','shop','blog','about'].forEach(page=>{
    const ti=document.getElementById('seo-'+page+'-title');
    const de=document.getElementById('seo-'+page+'-desc');
    if(ti) ti.value=seoData[page+'Title']||'';
    if(de) de.value=seoData[page+'Desc']||'';
  });
  // Update counters
  updateSeoCounter('seo-site-title','seo-st-c',60);
  updateSeoCounter('seo-site-desc','seo-sd-c',160);
  renderSeoHealth();
}

function saveSEO(){
  seoData.siteTitle=v('seo-site-title'); seoData.siteDesc=v('seo-site-desc');
  seoData.keywords=v('seo-keywords'); seoData.biz=v('seo-biz-name');
  DB.set('seo',seoData); renderSeoHealth();
  showToast('✅ SEO settings saved!','success');
}

function savePageSEO(page){
  const t=document.getElementById('seo-'+page+'-title')?.value||'';
  const d=document.getElementById('seo-'+page+'-desc')?.value||'';
  seoData[page+'Title']=t; seoData[page+'Desc']=d;
  DB.set('seo',seoData);
  showToast('✅ '+page.charAt(0).toUpperCase()+page.slice(1)+' SEO saved!','success');
}

function saveTracking(){
  seoData.ga=v('seo-ga')||seoData.ga;
  seoData.gsc=v('seo-gsc')||seoData.gsc;
  seoData.pixel=v('seo-pixel')||seoData.pixel;
  seoData.tiktok=v('seo-tiktok')||seoData.tiktok;
  DB.set('seo',seoData);
  showToast('✅ Tracking codes saved!','success');
}

function renderSeoHealth(){
  const checks=[
    {ok:!!seoData.siteTitle,text:'Global meta title set'},
    {ok:(seoData.siteTitle||'').length<=60,text:'Meta title ≤ 60 characters'},
    {ok:!!seoData.siteDesc,text:'Global meta description set'},
    {ok:(seoData.siteDesc||'').length<=160,text:'Meta description ≤ 160 characters'},
    {ok:!!seoData.keywords,text:'Global keywords defined'},
    {ok:!!seoData.ga,text:'Google Analytics connected'},
    {ok:!!seoData.pixel,text:'Facebook Pixel connected'},
    {ok:blogs.length>0,text:'Blog posts published (boosts SEO)'},
    {ok:products.every(p=>p.seoTitle),text:'All products have SEO titles'},
  ];
  const score=Math.round(checks.filter(c=>c.ok).length/checks.length*100);
  document.getElementById('seo-health-list').innerHTML=`
    <div class="seo-score">
      <div class="seo-bar"><div class="seo-fill" style="width:${score}%;background:${score>70?'var(--green)':score>40?'var(--yellow)':'var(--red)'}"></div></div>
      <div class="seo-num" style="color:${score>70?'var(--green)':score>40?'var(--yellow)':'var(--red)'}">${score}%</div>
    </div>
    `+checks.map(c=>`<div style="display:flex;align-items:center;gap:.5rem;padding:.4rem 0;border-bottom:1px solid var(--border);font-size:.8rem"><span>${c.ok?'✅':'❌'}</span><span style="color:${c.ok?'var(--text)':'var(--text2)'}">${c.text}</span></div>`).join('');
}

// ═══════════════════════════════════════════
// EMAIL SETTINGS
// ═══════════════════════════════════════════
function loadEmailSettings(){
  document.getElementById('smtp-platform').value=smtpData.platform||'brevo';
  document.getElementById('smtp-name').value=smtpData.name||'Pure Home Store';
  document.getElementById('smtp-email').value=smtpData.email||'';
  document.getElementById('smtp-reply').value=smtpData.reply||'';
  document.getElementById('smtp-host').value=smtpData.host||'smtp-relay.brevo.com';
  document.getElementById('smtp-port').value=smtpData.port||587;
  document.getElementById('smtp-user').value=smtpData.user||'';
  // Load templates
  const tpls=emailTemplates;
  if(tpls['order-confirm-subject']) document.getElementById('tpl-oc-subject').value=tpls['order-confirm-subject'];
  if(tpls['order-confirm-body']) document.getElementById('tpl-oc-body').value=tpls['order-confirm-body'];
  if(tpls['shipped-subject']) document.getElementById('tpl-ship-subject').value=tpls['shipped-subject'];
  if(tpls['shipped-body']) document.getElementById('tpl-ship-body').value=tpls['shipped-body'];
}

function saveSMTP(){
  smtpData={platform:v('smtp-platform'),name:v('smtp-name'),email:v('smtp-email'),reply:v('smtp-reply'),host:v('smtp-host'),port:v('smtp-port'),user:v('smtp-user'),enc:document.getElementById('smtp-enc').value};
  DB.set('smtp',smtpData);
  showToast('✅ SMTP settings saved!','success');
}

function saveEmailTemplate(type){
  if(type==='order-confirm'){emailTemplates['order-confirm-subject']=v('tpl-oc-subject');emailTemplates['order-confirm-body']=v('tpl-oc-body');}
  if(type==='shipped'){emailTemplates['shipped-subject']=v('tpl-ship-subject');emailTemplates['shipped-body']=v('tpl-ship-body');}
  if(type==='welcome'){emailTemplates['welcome-subject']=v('tpl-welcome-subject');emailTemplates['welcome-body']=v('tpl-welcome-body');}
  if(type==='abandoned'){emailTemplates['abandon-subject']=v('tpl-abandon-subject');emailTemplates['abandon-body']=v('tpl-abandon-body');}
  DB.set('email-tpls',emailTemplates);
  showToast('✅ Email template saved!','success');
}

// ═══════════════════════════════════════════
// PAYMENTS
// ═══════════════════════════════════════════
function loadPayments(){
  ['paypal','stripe','afterpay','bank'].forEach(p=>{
    const on=paymentData[p]?.enabled||false;
    const toggle=document.getElementById('pp-'+p+'-on');
    const wrap=document.getElementById('pp-'+p);
    const badge=document.getElementById('pp-'+p+'-badge');
    if(toggle) toggle.checked=on;
    if(wrap){wrap.classList.toggle('enabled',on);}
    if(badge) badge.style.display=on?'inline-flex':'none';
    // Load saved values
    if(p==='paypal'&&paymentData.paypal){document.getElementById('pp-paypal-email').value=paymentData.paypal.email||'';document.getElementById('pp-paypal-client').value=paymentData.paypal.client||'';}
    if(p==='stripe'&&paymentData.stripe){document.getElementById('pp-stripe-pub').value=paymentData.stripe.pub||'';}
    if(p==='bank'&&paymentData.bank){document.getElementById('pp-bank-name').value=paymentData.bank.name||'';document.getElementById('pp-bank-bsb').value=paymentData.bank.bsb||'';document.getElementById('pp-bank-acc').value=paymentData.bank.acc||'';}
  });
}

function toggleProvider(p){
  const on=document.getElementById('pp-'+p+'-on').checked;
  if(!paymentData[p]) paymentData[p]={};
  paymentData[p].enabled=on;
  document.getElementById('pp-'+p).classList.toggle('enabled',on);
  const badge=document.getElementById('pp-'+p+'-badge');
  if(badge) badge.style.display=on?'inline-flex':'none';
  DB.set('payments',paymentData);
}

function saveProvider(p){
  if(!paymentData[p]) paymentData[p]={};
  paymentData[p].enabled=document.getElementById('pp-'+p+'-on').checked;
  if(p==='paypal'){paymentData.paypal.email=v('pp-paypal-email');paymentData.paypal.client=v('pp-paypal-client');paymentData.paypal.mode=document.getElementById('pp-paypal-mode').value;}
  if(p==='stripe'){paymentData.stripe.pub=v('pp-stripe-pub');paymentData.stripe.sec=v('pp-stripe-sec');paymentData.stripe.wh=v('pp-stripe-wh');}
  if(p==='afterpay'){paymentData.afterpay.id=v('pp-afterpay-id');}
  if(p==='bank'){paymentData.bank.name=v('pp-bank-name');paymentData.bank.bsb=v('pp-bank-bsb');paymentData.bank.acc=v('pp-bank-acc');paymentData.bank.accName=v('pp-bank-acc-name');}
  DB.set('payments',paymentData);
  showToast('✅ '+p.charAt(0).toUpperCase()+p.slice(1)+' saved & connected!','success');
}

// ═══════════════════════════════════════════
// STORE SETTINGS
// ═══════════════════════════════════════════
function loadStoreSettings(){
  document.getElementById('ss-name').value=storeSettings.storeName||'Pure Home Store';
  document.getElementById('ss-tagline').value=storeSettings.tagline||'';
  document.getElementById('ss-domain').value=storeSettings.domain||'';
  document.getElementById('ss-email').value=storeSettings.email||'';
  document.getElementById('ss-phone').value=storeSettings.phone||'';
  document.getElementById('ss-abn').value=storeSettings.abn||'';
  document.getElementById('ss-address').value=storeSettings.address||'';
  document.getElementById('ss-free-min').value=storeSettings.freeShipMin||50;
  document.getElementById('ss-flat').value=storeSettings.flatRate||6.95;
  document.getElementById('ss-express').value=storeSettings.express||14.95;
  document.getElementById('ss-notif-email').value=storeSettings.notifEmail||'';
}

function saveStoreSettings(){
  storeSettings={storeName:v('ss-name'),tagline:v('ss-tagline'),domain:v('ss-domain'),email:v('ss-email'),phone:v('ss-phone'),abn:v('ss-abn'),address:v('ss-address'),freeShipMin:parseFloat(v('ss-free-min'))||50,flatRate:parseFloat(v('ss-flat'))||6.95,express:parseFloat(v('ss-express'))||14.95,notifEmail:v('ss-notif-email')};
  DB.set('store',storeSettings);
  showToast('✅ Store settings saved!','success');
}

function changeAdminPass(){
  const curr=v('ss-curr-pass'), newP=v('ss-new-pass'), conf=v('ss-conf-pass');
  if(curr!==ADMIN_PASS){showToast('❌ Current password is wrong','error');return;}
  if(newP!==conf){showToast('❌ Passwords do not match','error');return;}
  if(newP.length<6){showToast('❌ Password must be at least 6 characters','error');return;}
  ADMIN_PASS=newP; DB.set('admin_pass',ADMIN_PASS);
  document.getElementById('ss-curr-pass').value=''; document.getElementById('ss-new-pass').value=''; document.getElementById('ss-conf-pass').value='';
  showToast('✅ Password updated successfully!','success');
}

function exportAllData(){
  const data={products,orders,blogs,emailCampaigns,storeSettings,seoData,paymentData,smtpData,emailTemplates,exportDate:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='purehomestore-backup.json'; a.click();
  showToast('📥 Full backup exported!','success');
}

function resetAllData(){
  ['products','orders','blogs','campaigns','store','seo','payments','smtp','email-tpls'].forEach(k=>localStorage.removeItem('phs2_'+k));
  loadAllData(); renderDashboard();
  showToast('🗑️ All data reset to defaults','info');
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function v(id){ return document.getElementById(id)?.value||''; }

function updateSeoCounter(inputId, counterId, max){
  const el=document.getElementById(inputId);
  const counter=document.getElementById(counterId);
  if(!el||!counter) return;
  const len=el.value.length;
  counter.textContent=len+'/'+max;
  counter.className=len>max?'red-text':len>=max*0.85?'char-counter':'green-text';
}

function updateSmtpHelp(){
  const p=v('smtp-platform');
  const hosts={brevo:'smtp-relay.brevo.com',sendgrid:'smtp.sendgrid.net',gmail:'smtp.gmail.com',mailchimp:'smtp.mandrillapp.com'};
  const ports={brevo:587,sendgrid:587,gmail:587,mailchimp:587};
  if(hosts[p]){document.getElementById('smtp-host').value=hosts[p];document.getElementById('smtp-port').value=ports[p]||587;}
}

function showToast(msg, type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3200);
}

function copyToClipboard(text){
  navigator.clipboard?.writeText(text).then(()=>showToast('📋 Copied to clipboard!','success'));
}


function renderProductsTable(search='',catF=''){
  let list=products.filter(p=>{
    const ms=!search||p.name.toLowerCase().includes(search.toLowerCase());
    const mc=!catF||p.cat===catF;
    return ms&&mc;
  });
  document.getElementById('prod-count').textContent=products.length;
  document.getElementById('prods-tbody').innerHTML=list.length===0
    ?'<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">🛍️</div><p>No products found</p></div></td></tr>'
    :list.map(p=>{
      const cost=(p.cost||0)+(p.shipCost||0);
      const profit=p.price-cost;
      const margin=p.price>0?Math.round(profit/p.price*100):0;
      return `<tr>
        <td><img class="t-img" src="${p.imgs[0]||''}" onerror="this.style.background='#e5e7eb'"></td>
        <td><div class="t-name">${p.name}</div><div class="t-sub">${p.ship||''}</div></td>
        <td><span class="badge badge-${p.cat==='massage'?'green':p.cat==='air'?'blue':'purple'}">${p.cat}</span></td>
        <td><strong>$${p.price}</strong></td>
        <td style="color:var(--text2)">$${cost.toFixed(2)}</td>
        <td style="color:var(--green);font-weight:700">$${profit.toFixed(2)} (${margin}%)</td>
        <td>${p.ship||'-'}</td>
        <td><span class="badge ${p.status==='active'?'badge-green':'badge-yellow'}">${p.status}</span></td>
        <td><div style="display:flex;gap:.3rem">
          <button class="btn btn-sm" onclick="editProduct('${p.id}')">✏️</button>
          <button class="btn btn-sm" style="color:var(--red)" onclick="deleteProduct('${p.id}')">🗑️</button>
        </div></td>
      </tr>`;
    }).join('');
}

function searchProds(q){ renderProductsTable(q); }
function filterProdCat(c){ renderProductsTable('',c); }

function resetProdForm(){
  const fields=['ep-id','ep-name','ep-badge','ep-short','ep-desc','ep-feats','ep-img1','ep-img2','ep-img3','ep-price','ep-old','ep-cost','ep-ship-cost','ep-link','ep-ship','ep-seo-title','ep-seo-desc'];
  fields.forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('ep-cat').value='massage';
  document.getElementById('ep-status').value='active';
  document.getElementById('ep-del-btn').style.display='none';
  document.getElementById('ep-img-preview').innerHTML='';
  document.getElementById('ep-profit-box').style.display='none';
  document.getElementById('ep-reviews-list').innerHTML='';
}

function editProduct(id){
  const p=products.find(x=>x.id===id); if(!p) return;
  resetProdForm();
  go('add-product');
  setTimeout(()=>{
    document.getElementById('ep-id').value=p.id;
    document.getElementById('ep-name').value=p.name||'';
    document.getElementById('ep-badge').value=p.badge||'';
    document.getElementById('ep-cat').value=p.cat||'massage';
    document.getElementById('ep-short').value=p.shortDesc||'';
    document.getElementById('ep-desc').value=p.desc||'';
    document.getElementById('ep-feats').value=(p.feats||[]).join('\n');
    document.getElementById('ep-img1').value=p.imgs[0]||'';
    document.getElementById('ep-img2').value=p.imgs[1]||'';
    document.getElementById('ep-img3').value=p.imgs[2]||'';
    document.getElementById('ep-price').value=p.price||'';
    document.getElementById('ep-old').value=p.oldPrice||'';
    document.getElementById('ep-cost').value=p.cost||'';
    document.getElementById('ep-ship-cost').value=p.shipCost||0;
    document.getElementById('ep-link').value=p.link||'';
    document.getElementById('ep-ship').value=p.ship||'';
    document.getElementById('ep-seo-title').value=p.seoTitle||'';
    document.getElementById('ep-seo-desc').value=p.seoDesc||'';
    document.getElementById('ep-status').value=p.status||'active';
    document.getElementById('ep-del-btn').style.display='inline-flex';
    updateImgPreview(); calcProdProfit();
    // Reviews
    const rl=document.getElementById('ep-reviews-list');
    rl.innerHTML='';
    (p.reviews||[]).forEach(r=>addReviewField(r));
  },100);
}

function saveProduct(){
  const id=document.getElementById('ep-id').value;
  const name=document.getElementById('ep-name').value.trim();
  if(!name){showToast('❌ Product name is required','error');return;}
  const imgs=[document.getElementById('ep-img1').value,document.getElementById('ep-img2').value,document.getElementById('ep-img3').value].filter(Boolean);
  const feats=document.getElementById('ep-feats').value.split('\n').filter(Boolean);
  // Collect reviews
  const reviews=[];
  document.querySelectorAll('.rev-entry').forEach(el=>{
    const n=el.querySelector('.rev-name-in').value.trim();
    const t=el.querySelector('.rev-text-in').value.trim();
    const l=el.querySelector('.rev-loc-in').value.trim();
    if(n&&t) reviews.push({name:n,loc:l,stars:5,text:t});
  });
  const data={
    id:id||'p'+(Date.now()),name,badge:document.getElementById('ep-badge').value.trim(),
    cat:document.getElementById('ep-cat').value,shortDesc:document.getElementById('ep-short').value.trim(),
    desc:document.getElementById('ep-desc').value.trim(),feats,imgs,
    price:parseFloat(document.getElementById('ep-price').value)||0,
    oldPrice:parseFloat(document.getElementById('ep-old').value)||0,
    cost:parseFloat(document.getElementById('ep-cost').value)||0,
    shipCost:parseFloat(document.getElementById('ep-ship-cost').value)||0,
    link:document.getElementById('ep-link').value.trim(),ship:document.getElementById('ep-ship').value.trim(),
    seoTitle:document.getElementById('ep-seo-title').value.trim(),seoDesc:document.getElementById('ep-seo-desc').value.trim(),
    status:document.getElementById('ep-status').value,reviews
  };
  if(id){ const i=products.findIndex(p=>p.id===id); if(i>-1)products[i]=data; else products.push(data); }
  else products.push(data);
  DB.set('products',products);
  showToast('✅ Product saved successfully!','success');
  go('products');
}

function deleteProduct(id){
  if(!confirm('Delete this product permanently?')) return;
  products=products.filter(p=>p.id!==id);
  DB.set('products',products);
  renderProductsTable();
  showToast('🗑️ Product deleted','info');
}

function deleteCurrentProduct(){
  const id=document.getElementById('ep-id').value;
  if(id) deleteProduct(id);
  go('products');
}

function calcProdProfit(){
  const price=parseFloat(document.getElementById('ep-price').value)||0;
  const cost=parseFloat(document.getElementById('ep-cost').value)||0;
  const ship=parseFloat(document.getElementById('ep-ship-cost').value)||0;
  if(price>0){
    const total=cost+ship;
    const profit=price-total;
    const margin=Math.round(profit/price*100);
    document.getElementById('ep-profit-val').textContent='$'+profit.toFixed(2);
    document.getElementById('ep-margin-val').textContent=margin+'%';
    document.getElementById('ep-totalcost-val').textContent='$'+total.toFixed(2);
    document.getElementById('ep-profit-box').style.display='block';
  }
}

function updateImgPreview(){
  const imgs=[document.getElementById('ep-img1').value,document.getElementById('ep-img2').value,document.getElementById('ep-img3').value].filter(Boolean);
  document.getElementById('ep-img-preview').innerHTML=imgs.map(src=>`<div class="img-preview-item"><img src="${src}" onerror="this.style.background='#e5e7eb'"></div>`).join('');
}

function addReviewField(r=null){
  const div=document.createElement('div');
  div.className='rev-entry';
  div.style.cssText='border:1px solid var(--border);border-radius:8px;padding:.8rem;margin-bottom:.6rem;background:#FAFAFA';
  div.innerHTML=`
    <div class="grid-2" style="gap:.5rem;margin-bottom:.4rem">
      <input class="f-input rev-name-in" placeholder="Reviewer Name" value="${r?r.name:''}">
      <input class="f-input rev-loc-in" placeholder="Location e.g. Sydney, NSW" value="${r?r.loc||'':''}">
    </div>
    <textarea class="f-textarea rev-text-in" rows="2" placeholder="Review text...">${r?r.text:''}</textarea>
    <button onclick="this.closest('.rev-entry').remove()" style="background:none;border:none;color:var(--red);font-size:.75rem;cursor:pointer;margin-top:.3rem">✕ Remove</button>`;
  document.getElementById('ep-reviews-list').appendChild(div);
}


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Home Store — Admin CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F2F5;--sidebar:#111827;--sidebar-hover:#1F2937;--sidebar-active:#065F46;
  --white:#FFFFFF;--border:#E5E7EB;--text:#111827;--text2:#6B7280;
  --green:#059669;--green-lt:#D1FAE5;--red:#DC2626;--red-lt:#FEE2E2;
  --yellow:#D97706;--yellow-lt:#FEF3C7;--blue:#2563EB;--blue-lt:#DBEAFE;
  --purple:#7C3AED;--purple-lt:#EDE9FE;--orange:#EA580C;--orange-lt:#FFEDD5;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#111827 0%,#065F46 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
.login-card{background:#fff;border-radius:16px;padding:2.5rem;width:380px;box-shadow:var(--shadow-lg)}
.login-logo{text-align:center;margin-bottom:1.5rem}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--text)}
.login-logo h1 span{color:var(--green)}
.login-logo p{color:var(--text2);font-size:.82rem;margin-top:.3rem}
.login-card h2{font-size:1.1rem;font-weight:600;margin-bottom:1.2rem;text-align:center}
.login-field{margin-bottom:1rem}
.login-field label{display:block;font-size:.75rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem}
.login-field input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--green)}
.login-btn{width:100%;background:var(--green);color:#fff;border:none;padding:.85rem;border-radius:var(--radius);font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s;font-family:inherit}
.login-btn:hover{background:#047857}
.login-err{color:var(--red);font-size:.78rem;text-align:center;margin-top:.6rem;display:none}
.login-hint{color:var(--text2);font-size:.72rem;text-align:center;margin-top:.8rem}

/* ── LAYOUT ── */
#app{display:none;height:100vh;flex-direction:row}
#app.active{display:flex}
.sidebar{width:250px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── SIDEBAR ── */
.s-logo{padding:1.4rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.06)}
.s-logo h2{font-family:'Playfair Display',serif;font-size:1.15rem;color:#fff;font-weight:700}
.s-logo h2 span{color:#34D399}
.s-logo p{color:rgba(255,255,255,.35);font-size:.68rem;margin-top:.2rem}
.s-nav{flex:1;padding:.8rem 0}
.s-section{padding:.4rem 1rem .3rem;font-size:.6rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:.4rem}
.s-item{display:flex;align-items:center;gap:.65rem;padding:.65rem 1rem;cursor:pointer;transition:all .18s;color:rgba(255,255,255,.55);border-left:3px solid transparent;font-size:.82rem;font-weight:500;position:relative}
.s-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,.85)}
.s-item.active{background:rgba(5,150,105,.15);color:#34D399;border-left-color:#34D399}
.s-item .ico{font-size:.95rem;width:16px;text-align:center;flex-shrink:0}
.s-badge{background:var(--red);color:#fff;font-size:.6rem;font-weight:700;padding:.1rem .4rem;border-radius:10px;margin-left:auto}
.s-footer{padding:1rem;border-top:1px solid rgba(255,255,255,.06)}
.s-user{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.s-avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0}
.s-user-info p{color:#fff;font-size:.78rem;font-weight:600}
.s-user-info span{color:rgba(255,255,255,.35);font-size:.65rem}
.s-logout{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.5);padding:.5rem;border-radius:8px;font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .2s}
.s-logout:hover{background:rgba(255,255,255,.1);color:#fff}

/* ── TOPBAR ── */
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow)}
.topbar-left h1{font-size:1.05rem;font-weight:700}
.topbar-left p{color:var(--text2);font-size:.75rem;margin-top:.1rem}
.topbar-right{display:flex;gap:.6rem;align-items:center}
.tb-btn{padding:.48rem 1rem;border-radius:8px;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text);transition:all .18s}
.tb-btn:hover{background:var(--bg)}
.tb-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.tb-btn.primary:hover{background:#047857}
.tb-btn.danger{background:var(--red);color:#fff;border-color:var(--red)}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:1.5rem}
.panel{display:none}
.panel.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── CARDS ── */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem;box-shadow:var(--shadow)}
.card-title{font-size:.88rem;font-weight:700;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2rem}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
.gap{margin-bottom:1.2rem}

/* ── STAT CARDS ── */
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.8rem}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.stat-val{font-size:1.7rem;font-weight:700;font-family:'Playfair Display',serif;line-height:1}
.stat-lbl{font-size:.75rem;color:var(--text2);margin-top:.25rem}
.stat-chg{font-size:.72rem;font-weight:600;margin-top:.4rem}
.chg-up{color:var(--green)}
.chg-neutral{color:var(--text2)}

/* ── FORM ELEMENTS ── */
.f-group{margin-bottom:1rem}
.f-label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);margin-bottom:.38rem}
.f-input{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;outline:none;background:#fff;transition:border-color .2s;color:var(--text)}
.f-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.f-textarea{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;outline:none;resize:vertical;min-height:90px;background:#fff;transition:border-color .2s;line-height:1.6}
.f-textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.f-select{width:100%;padding:.7rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem;outline:none;background:#fff;cursor:pointer}
.f-select:focus{border-color:var(--green)}
.f-hint{font-size:.72rem;color:var(--text2);margin-top:.3rem}

/* ── BUTTONS ── */
.btn{padding:.6rem 1.2rem;border-radius:8px;font-family:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--text);transition:all .18s}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:#047857}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-danger:hover{background:#B91C1C}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-sm{padding:.38rem .8rem;font-size:.75rem}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}

/* ── TABLES ── */
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.table-header{padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:#FAFAFA}
.table-header h3{font-size:.88rem;font-weight:700}
table{width:100%;border-collapse:collapse}
thead th{background:#F9FAFB;padding:.65rem 1rem;text-align:left;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--border)}
tbody td{padding:.8rem 1rem;font-size:.82rem;border-bottom:1px solid #F3F4F6;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#F9FAFB}
.t-img{width:38px;height:38px;object-fit:cover;border-radius:6px;background:#f3f4f6}
.t-name{font-weight:600;color:var(--text)}
.t-sub{font-size:.72rem;color:var(--text2);margin-top:.1rem}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.2rem .65rem;border-radius:50px;font-size:.68rem;font-weight:700}
.badge-green{background:var(--green-lt);color:#065F46}
.badge-red{background:var(--red-lt);color:#991B1B}
.badge-yellow{background:var(--yellow-lt);color:#92400E}
.badge-blue{background:var(--blue-lt);color:#1E40AF}
.badge-purple{background:var(--purple-lt);color:#5B21B6}

/* ── TOGGLE ── */
.toggle-wrap{display:flex;align-items:center;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid var(--border)}
.toggle-wrap:last-child{border-bottom:none}
.toggle-info h4{font-size:.85rem;font-weight:600}
.toggle-info p{font-size:.75rem;color:var(--text2);margin-top:.15rem}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#D1D5DB;border-radius:24px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--green)}
.toggle input:checked+.toggle-slider:before{transform:translateX(20px)}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:1.3rem;gap:.2rem}
.tab{padding:.6rem 1rem;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;border-radius:6px 6px 0 0}
.tab:hover{color:var(--text);background:#F9FAFB}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── SEARCH ── */
.search-box{padding:.58rem .9rem;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.82rem;outline:none;width:220px;background:#fff}
.search-box:focus{border-color:var(--green)}

/* ── SEO METER ── */
.seo-score{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.seo-bar{flex:1;height:8px;background:#E5E7EB;border-radius:4px;overflow:hidden}
.seo-fill{height:100%;border-radius:4px;transition:width .5s;background:var(--green)}
.seo-num{font-size:.8rem;font-weight:700;min-width:28px;text-align:right}

/* ── IMAGE UPLOAD ── */
.img-upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;background:#FAFAFA}
.img-upload-area:hover{border-color:var(--green);background:#F0FDF4}
.img-upload-area p{color:var(--text2);font-size:.82rem;margin-top:.4rem}
.img-previews{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.img-preview-item{position:relative;width:80px;height:80px}
.img-preview-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid var(--border)}
.img-remove{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── EMAIL TEMPLATE ── */
.email-tpl{background:#F9FAFB;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.email-tpl-header{background:#111827;color:#fff;padding:.8rem 1rem;font-size:.8rem;font-weight:600}
.email-tpl-body{padding:1rem;font-size:.82rem;line-height:1.7}
.email-tpl-footer{background:#F3F4F6;padding:.6rem 1rem;font-size:.7rem;color:var(--text2);border-top:1px solid var(--border)}

/* ── ORDER DETAIL MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:1.8rem;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;position:relative}
.modal h2{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text2);padding:.2rem}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#111827;color:#fff;padding:.85rem 1.3rem;border-radius:10px;font-size:.82rem;font-weight:500;z-index:9998;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#065F46}
.toast.error{background:#991B1B}
.toast.info{background:#1E40AF}

/* ── MISC ── */
.divider{border:none;border-top:1px solid var(--border);margin:1.2rem 0}
.text-sm{font-size:.78rem;color:var(--text2);line-height:1.6}
.text-green{color:var(--green);font-weight:700}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text2)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:.8rem}
.empty-state p{font-size:.88rem}
.profit-box{background:var(--green-lt);border-radius:8px;padding:.8rem;font-size:.82rem;display:none}
.profit-box strong{color:#065F46}
.char-counter{font-size:.7rem;color:var(--text2);text-align:right;margin-top:.2rem}
.red-text{color:var(--red);font-size:.7rem;text-align:right}
.green-text{color:var(--green);font-size:.7rem;text-align:right}
.section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:.8rem;display:flex;align-items:center;gap:.4rem}
.info-box{background:var(--blue-lt);border:1px solid #BFDBFE;border-radius:8px;padding:.85rem;font-size:.8rem;color:#1E40AF;margin-bottom:1rem;line-height:1.6}
.warn-box{background:var(--yellow-lt);border:1px solid #FDE68A;border-radius:8px;padding:.85rem;font-size:.8rem;color:#92400E;margin-bottom:1rem;line-height:1.6}
.payment-provider{border:1.5px solid var(--border);border-radius:var(--radius);padding:1.1rem;margin-bottom:.8rem;transition:border-color .2s}
.payment-provider.enabled{border-color:var(--green);background:#F0FDF4}
.payment-provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.payment-provider-title{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:.5rem}
.payment-provider-fields{display:none;padding-top:.8rem;border-top:1px solid var(--border);margin-top:.8rem}
.payment-provider.enabled .payment-provider-fields{display:block}

@media(max-width:900px){
  .sidebar{width:200px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Pure<span>Home</span> Store</h1>
      <p>Admin Content Management System</p>
    </div>
    <h2>🔐 Sign in to Dashboard</h2>
    <div class="login-field"><label>Username</label><input type="text" id="l-user" value="admin" placeholder="admin"></div>
    <div class="login-field"><label>Password</label><input type="password" id="l-pass" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Login to CMS</button>
    <div class="login-err" id="l-err">❌ Incorrect username or password</div>
    <p class="login-hint">Default: admin / purehome123</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="s-logo">
      <h2>Pure<span>Home</span> CMS</h2>
      <p>Store Admin Panel</p>
    </div>
    <nav class="s-nav">
      <div class="s-section">Overview</div>
      <div class="s-item active" onclick="go('dashboard')"><span class="ico">📊</span>Dashboard</div>
      <div class="s-item" onclick="go('orders')"><span class="ico">📦</span>Orders<span class="s-badge" id="orders-badge" style="display:none">0</span></div>
      <div class="s-section">Products</div>
      <div class="s-item" onclick="go('products')"><span class="ico">🛍️</span>All Products</div>
      <div class="s-item" onclick="go('add-product')"><span class="ico">➕</span>Add Product</div>
      <div class="s-section">Content</div>
      <div class="s-item" onclick="go('blog')"><span class="ico">📝</span>Blog Posts</div>
      <div class="s-item" onclick="go('add-blog')"><span class="ico">✏️</span>New Blog Post</div>
      <div class="s-section">Marketing</div>
      <div class="s-item" onclick="go('email-marketing')"><span class="ico">📧</span>Email Marketing</div>
      <div class="s-section">Settings</div>
      <div class="s-item" onclick="go('seo')"><span class="ico">🔍</span>SEO Settings</div>
      <div class="s-item" onclick="go('email-settings')"><span class="ico">✉️</span>Email & Templates</div>
      <div class="s-item" onclick="go('payments')"><span class="ico">💳</span>Payment Gateways</div>
      <div class="s-item" onclick="go('store-settings')"><span class="ico">⚙️</span>Store Settings</div>
    </nav>
    <div class="s-footer">
      <div class="s-user">
        <div class="s-avatar">A</div>
        <div class="s-user-info"><p id="s-username">Admin</p><span>purehomestore.com.au</span></div>
      </div>
      <button class="s-logout" onclick="doLogout()">← Logout</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub">Welcome back to your store</p>
      </div>
      <div class="topbar-right">
        <button class="tb-btn" onclick="go('add-product')">+ Add Product</button>
        <button class="tb-btn primary" id="top-action-btn">Save Changes</button>
      </div>
    </div>

    <div class="content">

      <!-- ═══ DASHBOARD ═══ -->
      <div class="panel active" id="panel-dashboard">
        <div class="grid-4 gap">
          <div class="stat-card">
            <div class="stat-top"><div><div class="stat-val" id="d-rev">$0</div><div class="stat-lbl">Total Revenue</div></div><div class="stat-icon" style="background:var(--green-lt)">💰</div></div>
            <div class="stat-chg chg-neutral" id="d-rev-chg">Start marketing to earn!</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div><div class="stat-val" id="d-orders">0</div><div class="stat-lbl">Total Orders</div></div><div class="stat-icon" style="background:var(--blue-lt)">📦</div></div>
            <div class="stat-chg chg-neutral">Ready to receive orders</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div><div class="stat-val" id="d-prods">0</div><div class="stat-lbl">Live Products</div></div><div class="stat-icon" style="background:var(--purple-lt)">🛍️</div></div>
            <div class="stat-chg chg-up" id="d-prod-chg">✅ All active</div>
          </div>
          <div class="stat-card">
            <div class="stat-top"><div><div class="stat-val">5K</div><div class="stat-lbl">Email Leads</div></div><div class="stat-icon" style="background:var(--orange-lt)">📧</div></div>
